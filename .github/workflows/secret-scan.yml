name: Secret scan

# MFGDevOps_Pub check (PUB-D-15). Fails a pull request whose new commits add
# something that looks like a secret (API key, token, private key, password
# string). Uses the open-source gitleaks CLI (MIT), run directly, so no
# gitleaks-action license is needed. Only the pull request's own commits are
# scanned; output is redacted so a found secret is not printed in the log.
# A false positive: add the finding's fingerprint to .gitleaksignore, with a
# comment saying why, in the same pull request.
# Rollback: revert the pull request that added this workflow.

on:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan this pull request's commits
        run: ./gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose --exit-code 1
